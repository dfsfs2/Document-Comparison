server:
  port: ${PORT:8080}
  error:
    include-message: never
  servlet:
    session:
      timeout: 30m
      cookie:
        name: DOC_COMPARE_SESSION
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
spring:
  datasource:
    url: ${JDBC_URL:jdbc:mysql://localhost:3306/doc_compare?connectionTimeZone=UTC}
    username: ${MYSQL_USER:doc_compare}
    password: ${MYSQL_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  session:
    data:
      redis:
        namespace: doc-compare:session
  sql:
    init:
      mode: always
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 21MB
app:
  agent:
    url: ${AGENT_URL:http://localhost:8000}
    token: ${AGENT_TOKEN}
