server {
    listen 80;
    server_name _;
    client_max_body_size 21m;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 130s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
